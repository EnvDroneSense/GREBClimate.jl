name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Check formatting
        run: |
          import Pkg; Pkg.add(name="JuliaFormatter", version="2")
          using JuliaFormatter
          ok = all(format(d; overwrite=false) for d in ("src", "test", "benchmark"))
          ok || error("Not formatted: run JuliaFormatter.format on src, test and benchmark")
        shell: julia --color=yes {0}

  benchmark-smoke:
    # Checks that the comparison tool runs and prints its self-check, not the
    # numbers: the machine is shared and there is no dataset.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Run a small comparison
        run: |
          import Pkg
          Pkg.activate("benchmark")
          Pkg.develop(path=".")
          Pkg.instantiate()
          include(joinpath(pwd(), "benchmark", "common.jl"))
          include(joinpath(pwd(), "benchmark", "compare.jl"))
          x = rand(1000)
          ok = compare_kernels("sum" => () -> sum(x), "sum twice" => () -> sum(x) + sum(x); seconds=1)
          println("self-check passed: ", ok)
        shell: julia --color=yes {0}

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1']
        os: [ubuntu-latest]
        shard: [light, heavy]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # Instrumentation costs runtime; measuring on both Julia versions
          # buys no extra information.
          coverage: ${{ matrix.julia-version == '1' }}
        env:
          GREB_TEST_SHARD: ${{ matrix.shard }}
          # The model only runs circulation!(Ta)/circulation!(q) concurrently
          # when nthreads() > 1 (src/core/tendencies.jl). Thread count is fixed at
          # startup, so a 1-thread test process never reaches that branch.
          # Pkg.test's subprocess inherits this.
          JULIA_NUM_THREADS: '2,0'
          # The dataset is not available in CI, and the tests resolve it with
          # allow_download=false, so data-dependent testsets skip. This is a
          # belt-and-braces guard: if something ever does reach the DataDep,
          # fail loudly instead of blocking on the stdin consent prompt.
          DATADEPS_ALWAYS_ACCEPT: 'false'
          DATADEPS_DISABLE_DOWNLOAD: 'true'

      # Both shards upload; Codecov merges them into one report.
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.julia-version == '1'
      - uses: codecov/codecov-action@v5
        if: matrix.julia-version == '1'
        with:
          files: lcov.info
          flags: ${{ matrix.shard }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
